# ============================================================
# nginx config for pos-web
#
# PLACE: POS/Project/Frontend/pos-web/nginx.conf
# (referenced by pos-web/Dockerfile — COPY nginx.conf ...)
#
# Two jobs:
#   1. Serve the React static files (SPA routing → index.html fallback)
#   2. Proxy /api/* to the pos-api container (service name in compose)
# ============================================================
server {
    listen 80;
    listen [::]:80; # listen on Ipv6 too
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- API proxy: /api/* → pos-api container port 8080 ---
    location /api/ {
        proxy_pass http://pos-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SPA routing: unknown paths → index.html (react-router) ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Static asset caching ---
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
